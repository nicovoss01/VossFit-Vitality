name: Build VossFit Vitality APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'a_clean_high_contrast_app_icon_style_graphic_on_a.png'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install VossFit launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp a_clean_high_contrast_app_icon_style_graphic_on_a.png android/app/src/main/res/drawable-nodpi/vossfit_icon.png
      - name: Build installable APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VossFit-Vitality.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VossFit-Vitality-APK
          path: VossFit-Vitality.apk
          if-no-files-found: error
